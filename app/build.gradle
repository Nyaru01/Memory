plugins {
    id 'com.android.application'
}

android {
	namespace "fr.memomimi.app"
    compileSdkVersion 35

    defaultConfig {
        applicationId 'fr.memomimi.app'
        minSdkVersion 23
        //noinspection ExpiringTargetSdkVersion,ExpiredTargetSdkVersion
        targetSdkVersion 35
        versionCode 59
        versionName "9.18"
        testInstrumentationRunner 'fr.memomimi.app.VisualEffectsChecks'

    }

    signingConfigs {
        localDemo {
            storeFile file('D:/AndroidDev/signing/MemoMondes.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.localDemo }
        release {
            minifyEnabled false
            signingConfig signingConfigs.localDemo
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig = false
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'memomondes.captureDir', rootProject.file('releases/validation/rendered').absolutePath
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
                    '--add-opens=java.base/java.util=ALL-UNNAMED',
                    '--add-opens=java.base/java.io=ALL-UNNAMED',
                    '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
